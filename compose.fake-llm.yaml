# Runs the stack against backend/tests/fake_ollama.py instead of a real model,
# for exercising upload -> indexing -> answer -> memory without Ollama:
#   docker compose -f compose.yaml -f compose.fake-llm.yaml up --build
services:
  fake-ollama:
    build: ./backend
    command: ["uvicorn", "tests.fake_ollama:app", "--host", "0.0.0.0", "--port", "11434"]
    volumes:
      - ./backend/tests:/app/tests:ro

  api:
    environment:
      OLLAMA_BASE_URL: http://fake-ollama:11434
    depends_on:
      - fake-ollama

  worker:
    environment:
      OLLAMA_BASE_URL: http://fake-ollama:11434
    depends_on:
      - fake-ollama
