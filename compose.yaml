services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: localrag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d localrag"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag-local-password@postgres:5432/localrag
      UPLOAD_DIR: /data/uploads
    volumes:
      - document-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag-local-password@postgres:5432/localrag
      UPLOAD_DIR: /data/uploads
    volumes:
      - document-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  document-data:
