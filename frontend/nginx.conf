server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;

    # Docker's DNS, re-resolved every 10 s: with a fixed upstream nginx resolves
    # "api" once at startup and returns 502 after the api container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx's mime.types has no .mjs; browsers refuse module scripts (the
    # pdf.js worker) served as application/octet-stream.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
